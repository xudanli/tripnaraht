name: Readiness P1 Gates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "scripts/ci/check-execution-os-stability-contract.ts"
      - "scripts/ci/validate-change-impact-descriptor.ts"
      - "scripts/ci/route-and-run-routing-gate.lib.ts"
      - "scripts/ci/assert-route-and-run-routing-gate.ts"
      - "change-impact-descriptor.v1.json"
      - ".github/pull_request_template.md"
      - "scripts/readiness-p1.sh"
      - "scripts/release-gate-v2.sh"
      - "scripts/release-gate-v2-write.mjs"
      - "scripts/post-build.sh"
      - "scripts/rl-infra/roll/**"
      - "nest-cli.json"
      - "tsconfig.json"
      - "tsconfig.backend.json"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.ci.json"
      - "tsconfig.physics.json"
      - "tsconfig.trips.json"
      - ".github/workflows/readiness-p1.yml"
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "scripts/ci/check-execution-os-stability-contract.ts"
      - "scripts/ci/validate-change-impact-descriptor.ts"
      - "scripts/ci/route-and-run-routing-gate.lib.ts"
      - "scripts/ci/assert-route-and-run-routing-gate.ts"
      - "change-impact-descriptor.v1.json"
      - ".github/pull_request_template.md"
      - "scripts/readiness-p1.sh"
      - "scripts/release-gate-v2.sh"
      - "scripts/release-gate-v2-write.mjs"
      - "scripts/post-build.sh"
      - "scripts/rl-infra/roll/**"
      - "nest-cli.json"
      - "tsconfig.json"
      - "tsconfig.backend.json"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.ci.json"
      - "tsconfig.physics.json"
      - "tsconfig.trips.json"
      - ".github/workflows/readiness-p1.yml"

jobs:
  readiness-p1:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run readiness P1 (lint + check:physical + typecheck:physics + typecheck:trips + build + ROLL week1-3 + AO/TD tests)
        env:
          CID_STRICT_DIFF: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          CID_MERGE_BASE: ${{ github.event.pull_request.base.sha || '' }}
        run: npm run readiness:p1

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-p1-report
          path: readiness-p1-report.json
          if-no-files-found: warn
