name: Readiness P1 Gates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "scripts/readiness-p1.sh"
      - "scripts/release-gate-v2.sh"
      - "scripts/release-gate-v2-write.mjs"
      - "scripts/post-build.sh"
      - "scripts/rl-infra/roll/**"
      - "nest-cli.json"
      - "tsconfig.json"
      - "tsconfig.backend.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/readiness-p1.yml"
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "scripts/readiness-p1.sh"
      - "scripts/release-gate-v2.sh"
      - "scripts/release-gate-v2-write.mjs"
      - "scripts/post-build.sh"
      - "scripts/rl-infra/roll/**"
      - "nest-cli.json"
      - "tsconfig.json"
      - "tsconfig.backend.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/readiness-p1.yml"

jobs:
  readiness-p1:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run readiness P1 (lint + build + ROLL week1-3 + AO/TD tests)
        run: npm run readiness:p1

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-p1-report
          path: readiness-p1-report.json
          if-no-files-found: warn
