name: ROLL Prod Guardrails Gate

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'scripts/rl-infra/roll/**'
      - 'src/agent/training/services/roll-client.service.ts'
      - 'src/agent/training/services/roll-policy-adapter.service.ts'

concurrency:
  group: roll-prod-guardrails-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prod-fast-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate prod env guardrails
        run: |
          test -f scripts/rl-infra/roll/.env.prod
          rg -n "^ROLL_BRIDGE_TIMEOUT_MS=[0-9]+$" scripts/rl-infra/roll/.env.prod
          rg -n "^ROLL_STRICT_MODE=true$" scripts/rl-infra/roll/.env.prod
          rg -n "^ROLL_ALLOW_SIMULATION=false$" scripts/rl-infra/roll/.env.prod
          rg -n "^ROLL_ALLOW_FALLBACK=true$" scripts/rl-infra/roll/.env.prod

      - name: Validate required prod files
        run: |
          test -f scripts/rl-infra/roll/docker-compose.yml
          test -f scripts/rl-infra/roll/docker-compose.prod.yml
          test -f scripts/rl-infra/roll/verify-prod-guardrails.sh

  prod-strict-gate:
    needs: prod-fast-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure verify script executable
        run: chmod +x scripts/rl-infra/roll/verify-prod-guardrails.sh

      - name: Start prod guardrails stack
        working-directory: scripts/rl-infra/roll
        run: |
          docker compose --env-file .env.prod \
            -f docker-compose.yml -f docker-compose.prod.yml up -d --build

      - name: Wait for bridge health
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:8001/health >/dev/null; then
              echo "Bridge is healthy"
              exit 0
            fi
            sleep 3
          done
          echo "Bridge health check timed out"
          exit 1

      - name: Verify prod guardrails
        working-directory: scripts/rl-infra/roll
        env:
          ROLL_BRIDGE_URL: http://localhost:8001
          ENV_FILE: .env.prod
        run: ./verify-prod-guardrails.sh

      - name: Dump compose logs on failure
        if: failure()
        working-directory: scripts/rl-infra/roll
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --no-color

      - name: Teardown prod guardrails stack
        if: always()
        working-directory: scripts/rl-infra/roll
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml down -v || true
