name: Execution Risk Package CI

on:
  pull_request:
    paths:
      - 'src/trips/execution-risk-center/**'
      - 'docs/TripNARA-Execution-Risk-Backend-Package-V1/**'
      - 'scripts/generate-execution-risk-contracts.ts'
      - 'scripts/validate-execution-risk-knowledge.ts'
      - 'scripts/seed-execution-risk-knowledge.ts'
      - '.github/workflows/execution-risk-package-ci.yml'
  workflow_dispatch:

jobs:
  execution-risk-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate package consistency (Sprint 0A gate)
        run: npm run validate:execution-risk-package

      - name: Validate OpenAPI structural lint (Sprint 0B gate)
        run: npm run validate:execution-risk-openapi

      - name: Validate knowledge seed alignment
        run: npm run validate:execution-risk-knowledge

      - name: ERC unit + harness + acceptance tests
        run: npx jest src/trips/execution-risk-center --no-coverage
