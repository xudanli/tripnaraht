# .github/workflows/security-scan.yml
#
# 依赖安全扫描 CI/CD Workflow
#
# 触发条件：
# - Push 到 master/main 分支
# - Pull Request
# - 每日定时扫描 (UTC 00:00)
#
# 用途：
# - 自动扫描依赖漏洞
# - 阻止含有高危/严重漏洞的 PR 合并
# - 生成安全报告并上传为 artifact

name: Security Scan

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  schedule:
    # 每天 UTC 00:00 运行 (北京时间 08:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  security-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install jq (JSON processor)
        run: sudo apt-get install -y jq

      - name: Install dependencies
        run: npm ci

      - name: Run security scan
        id: security_scan
        run: |
          mkdir -p security-reports
          chmod +x scripts/security-scan.sh
          ./scripts/security-scan.sh || echo "SCAN_FAILED=true" >> $GITHUB_ENV
        continue-on-error: true

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report-${{ github.run_number }}
          path: security-reports/
          retention-days: 30

      - name: Check scan result
        if: env.SCAN_FAILED == 'true'
        run: |
          echo "❌ Security scan failed: High or critical vulnerabilities detected (see scripts/security-scan.sh)"
          echo "Please review the security report artifact and fix the vulnerabilities"
          exit 1

      - name: Comment PR with security results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const glob = require('glob');

            // Find the latest summary file
            const summaryFiles = glob.sync('security-reports/audit-summary-*.txt');
            if (summaryFiles.length === 0) {
              console.log('No summary file found');
              return;
            }

            const summaryFile = summaryFiles.sort().reverse()[0];
            const summary = fs.readFileSync(summaryFile, 'utf8');

            // Post comment to PR
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔒 Security Scan Results\n\n\`\`\`\n${summary}\n\`\`\``
            });

  dependency-review:
    name: Dependency Review (PR only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0
