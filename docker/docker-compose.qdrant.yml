# TripNARA Entity Resolution 向量库（Qdrant）
#
# 启动：
#   docker compose -f docker/docker-compose.qdrant.yml up -d
#
# 同机 NestJS 应用（docker-compose 同一 project/network）：
#   QDRANT_URL=http://qdrant:6333
#
# 宿主机脚本 / devbox seed：
#   QDRANT_URL=http://127.0.0.1:6333

services:
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: tripnara-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP REST（Entity Resolution 用这个）
      - "6334:6334"   # gRPC（可选）
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/collections"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qdrant_storage:
