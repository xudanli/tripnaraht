version: '3.8'

services:
  training-service:
    build:
      context: .
      dockerfile: Dockerfile.training
    ports:
      - "8001:8001"
    environment:
      - TRAINING_SERVICE_PORT=8001
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - RAY_ADDRESS=ray://ray-head:10001
    depends_on:
      - mlflow
    networks:
      - rl-infra

  policy-service:
    build:
      context: .
      dockerfile: Dockerfile.policy
    ports:
      - "8002:8002"
    environment:
      - POLICY_SERVICE_PORT=8002
      - MODEL_DIR=/models
    volumes:
      - model-data:/models
    networks:
      - rl-infra

  llm-judge-service:
    build:
      context: .
      dockerfile: Dockerfile.judge
    ports:
      - "8003:8003"
    environment:
      - LLM_JUDGE_SERVICE_PORT=8003
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    networks:
      - rl-infra

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --backend-store-uri sqlite:///mlflow.db
    volumes:
      - mlflow-data:/mlflow
    networks:
      - rl-infra

networks:
  rl-infra:
    driver: bridge

volumes:
  model-data:
  mlflow-data:
