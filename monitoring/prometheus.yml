# Prometheus 配置文件
# TripNARA RAG 监控

global:
  scrape_interval: 15s # 每15秒抓取一次指标
  evaluation_interval: 15s # 每15秒评估一次规则
  external_labels:
    cluster: 'tripnara'
    service: 'rag'

# 告警管理器配置（可选）
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - 'alertmanager:9093'

# 规则文件（可选）
# rule_files:
#   - 'alerts.yml'

# 抓取配置
scrape_configs:
  # TripNARA RAG应用指标
  - job_name: 'tripnara-rag'
    metrics_path: '/rag/metrics'
    scrape_interval: 10s # RAG指标更新较快，10秒抓取一次
    static_configs:
      - targets: ['localhost:3000'] # 修改为实际的应用地址
        labels:
          env: 'development' # 修改为实际环境: development, staging, production

  # Node.js进程指标（如果启用）
  # - job_name: 'tripnara-nodejs'
  #   metrics_path: '/metrics'
  #   static_configs:
  #     - targets: ['localhost:3000']

  # Redis指标（如果启用 redis_exporter）
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['localhost:9121']

  # PostgreSQL指标（如果启用 postgres_exporter）
  # - job_name: 'postgres'
