# prometheus.yml - Prometheus Configuration for TripNARA

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'tripnara-iceland'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# Load rules once and periodically evaluate them
rule_files:
  - '/etc/prometheus/rules/prometheus-alerts.yml'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # TripNARA Application Metrics
  - job_name: 'tripnara-iceland'
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:3000']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [__scheme__]
        target_label: scheme

  # Node Exporter (System Metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']

  # PostgreSQL Exporter (Database Metrics)
  - job_name: 'postgres'
    static_configs:
      - targets: ['localhost:9187']
